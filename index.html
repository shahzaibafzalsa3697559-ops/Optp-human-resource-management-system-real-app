<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPTP :: Employee Record System (Google Drive)</title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<style>
  :root{
    --bg:#05080a; --panel:#0b1315; --panel2:#0f1a1c; --line:#173a2e;
    --green:#39ff8a; --green-dim:#1c8a52; --cyan:#23d5f0; --amber:#ffb020; --red:#ff3b5c;
    --text:#cdeee0; --text-dim:#6f9686;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--bg);}
  body{ font-family: ui-monospace, 'Consolas', 'Courier New', monospace; color:var(--text); overflow-x:hidden; }
  #matrix-bg{ position:fixed; inset:0; z-index:0; opacity:0.35; }
  .scanlines{ position:fixed; inset:0; z-index:1; pointer-events:none;
    background:repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.35) 3px, rgba(0,0,0,0) 4px);
    mix-blend-mode:overlay; }
  .grid-overlay{ position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: linear-gradient(rgba(35,213,240,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(35,213,240,0.05) 1px, transparent 1px);
    background-size: 42px 42px; }
  #app{ position:relative; z-index:2; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:24px 16px 60px; }
  .eyebrow{ font-size:11px; letter-spacing:3px; color:var(--green-dim); text-transform:uppercase; }
  h1,h2,h3{ font-weight:600; letter-spacing:1px; margin:0; }
  .glow{ text-shadow:0 0 8px rgba(57,255,138,0.55), 0 0 18px rgba(57,255,138,0.25); }
  .panel{ background:linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%); border:1px solid var(--line);
    border-radius:6px; box-shadow: 0 0 0 1px rgba(57,255,138,0.03), 0 8px 30px rgba(0,0,0,0.6); position:relative; }
  .panel::before{ content:""; position:absolute; top:0; left:0; right:0; height:2px;
    background:linear-gradient(90deg, transparent, var(--green), transparent); opacity:0.6; }
  .btn{ font-family:inherit; cursor:pointer; border-radius:4px; border:1px solid var(--green-dim);
    background:rgba(57,255,138,0.06); color:var(--green); padding:10px 18px; font-size:13px; letter-spacing:1px;
    text-transform:uppercase; transition:all .15s ease; }
  .btn:hover{ background:rgba(57,255,138,0.16); box-shadow:0 0 14px rgba(57,255,138,0.25); }
  .btn:active{ transform:scale(0.97); }
  .btn.cyan{ border-color:#0f6a7d; color:var(--cyan); background:rgba(35,213,240,0.06); }
  .btn.cyan:hover{ background:rgba(35,213,240,0.16); box-shadow:0 0 14px rgba(35,213,240,0.25); }
  .btn.amber{ border-color:#8a5f10; color:var(--amber); background:rgba(255,176,32,0.06); }
  .btn.amber:hover{ background:rgba(255,176,32,0.16); box-shadow:0 0 14px rgba(255,176,32,0.25); }
  .btn.red{ border-color:#8a1c30; color:var(--red); background:rgba(255,59,92,0.06); }
  .btn.red:hover{ background:rgba(255,59,92,0.16); box-shadow:0 0 14px rgba(255,59,92,0.25); }
  .btn:disabled{ opacity:0.35; cursor:not-allowed; }
  input, select, textarea{ font-family:inherit; background:#081010; border:1px solid var(--line); color:var(--text);
    border-radius:4px; padding:9px 10px; font-size:13.5px; width:100%; outline:none; }
  input:focus, select:focus, textarea:focus{ border-color:var(--green-dim); box-shadow:0 0 0 2px rgba(57,255,138,0.12); }
  label{ font-size:12px; color:var(--text-dim); letter-spacing:0.5px; display:block; margin-bottom:5px; }
  .req::after{ content:" *"; color:var(--red); }
  .field{ margin-bottom:14px; }
  .row{ display:flex; gap:14px; flex-wrap:wrap; }
  .row > .field{ flex:1; min-width:220px; }
  .radio-group{ display:flex; gap:16px; flex-wrap:wrap; margin-top:4px;}
  .radio-opt{ display:flex; align-items:center; gap:6px; font-size:13px; color:var(--text); cursor:pointer; }
  .radio-opt input{ width:auto; accent-color:var(--green); }
  .hidden{ display:none !important; }
  a.linklike{ color:var(--cyan); cursor:pointer; text-decoration:underline; }
  #login-screen{ width:100%; max-width:440px; margin-top:8vh; }
  .login-box{ padding:34px 30px; text-align:center; }
  .term-cursor::after{ content:"█"; animation:blink 1s step-end infinite; color:var(--green); }
  @keyframes blink{ 50%{ opacity:0; } }
  #topbar{ width:100%; max-width:1180px; display:flex; justify-content:space-between; align-items:center;
    margin-bottom:22px; padding-bottom:14px; border-bottom:1px solid var(--line); }
  #topbar .who{ font-size:12px; color:var(--text-dim); }
  #topbar .who b{ color:var(--green); }
  #main-wrap{ width:100%; max-width:1180px; }
  .dash-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-top:8px; }
  @media(max-width:860px){ .dash-grid{ grid-template-columns:1fr; } }
  .dash-card{ padding:26px 22px; cursor:pointer; transition:all .2s ease; }
  .dash-card:hover{ border-color:var(--green-dim); transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,0.6), 0 0 20px rgba(57,255,138,0.12);}
  .dash-card .icon{ font-size:26px; margin-bottom:10px; }
  .dash-card .count{ font-size:32px; color:var(--green); margin:8px 0 4px; }
  .dash-card .lbl{ font-size:13px; color:var(--text-dim); letter-spacing:1px; text-transform:uppercase; }
  .search-bar{ display:flex; gap:10px; margin:18px 0; }
  .search-bar input{ flex:1; }
  .file-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:16px; margin-top:16px; }
  .file-card{ padding:14px 10px 12px; text-align:center; cursor:pointer; }
  .file-card:hover{ border-color:var(--green-dim); box-shadow:0 0 16px rgba(57,255,138,0.15); }
  .file-thumb{ width:74px; height:74px; border-radius:6px; object-fit:cover; margin:0 auto 10px; border:1px solid var(--line); display:block; background:#081010; }
  .file-thumb.placeholder{ display:flex; align-items:center; justify-content:center; font-size:26px; color:var(--text-dim); }
  .file-name{ font-size:12.5px; color:var(--text); word-break:break-word; }
  .file-id{ font-size:10.5px; color:var(--text-dim); margin-top:3px; }
  .file-status{ font-size:9.5px; letter-spacing:1px; margin-top:6px; text-transform:uppercase; }
  .file-status.active{ color:var(--green); }
  .file-status.gone{ color:var(--amber); }
  .empty-note{ color:var(--text-dim); font-size:13px; padding:30px; text-align:center; }
  .modal-overlay{ position:fixed; inset:0; background:rgba(2,4,4,0.82); z-index:50;
    display:flex; align-items:flex-start; justify-content:center; overflow-y:auto; padding:40px 14px; }
  .modal-box{ width:100%; max-width:760px; padding:26px 26px 30px; }
  .modal-close{ float:right; cursor:pointer; color:var(--text-dim); font-size:20px; line-height:1; }
  .modal-close:hover{ color:var(--red); }
  .detail-grid{ display:grid; grid-template-columns:1fr 1fr; gap:10px 24px; margin:16px 0; font-size:13px; }
  @media(max-width:600px){ .detail-grid{ grid-template-columns:1fr; } }
  .detail-item .k{ color:var(--text-dim); font-size:11px; letter-spacing:1px; text-transform:uppercase; }
  .detail-item .v{ color:var(--text); margin-top:2px; }
  .doc-thumbs{ display:flex; gap:14px; margin:16px 0; flex-wrap:wrap; }
  .doc-thumbs img{ width:120px; height:80px; object-fit:cover; border:1px solid var(--line); border-radius:4px; }
  .doc-thumbs .lbl{ font-size:10px; color:var(--text-dim); text-align:center; margin-top:4px; }
  .modal-actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:20px; border-top:1px solid var(--line); padding-top:18px; }
  .upload-box{ border:1px dashed var(--line); border-radius:6px; padding:14px; text-align:center; cursor:pointer; font-size:12px; color:var(--text-dim); }
  .upload-box:hover{ border-color:var(--green-dim); color:var(--green); }
  .upload-preview{ width:90px; height:90px; object-fit:cover; border-radius:6px; margin:8px auto 0; display:block; border:1px solid var(--line); }
  .toast{ position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#081010; border:1px solid var(--green-dim);
    color:var(--green); padding:12px 20px; border-radius:6px; font-size:13px; z-index:100; box-shadow:0 0 20px rgba(57,255,138,0.2); animation:toastIn .2s ease; max-width:90vw; }
  .toast.err{ border-color:#8a1c30; color:var(--red); box-shadow:0 0 20px rgba(255,59,92,0.2); }
  @keyframes toastIn{ from{ opacity:0; transform:translate(-50%,10px);} to{opacity:1; transform:translate(-50%,0);} }
  .section-title{ display:flex; align-items:center; gap:10px; margin-bottom:6px; }
  .back-link{ font-size:12px; color:var(--cyan); cursor:pointer; }
  .form-panel{ padding:24px; margin-top:16px; }
  .subhead{ font-size:12px; color:var(--green); letter-spacing:2px; text-transform:uppercase; margin:22px 0 12px; border-bottom:1px solid var(--line); padding-bottom:6px; }
  .form-actions{ display:flex; gap:10px; margin-top:20px; }
  .pw-modal-box{ max-width:340px; padding:26px; text-align:center; }
  .stat-line{ font-size:11px; color:var(--text-dim); margin-top:4px; }
  #loading-screen{ width:100%; max-width:420px; margin-top:20vh; text-align:center; }
  .spinner{ width:34px; height:34px; border:3px solid var(--line); border-top-color:var(--green); border-radius:50%;
    animation:spin 0.9s linear infinite; margin:18px auto; }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .gsi-btn-wrap{ display:flex; justify-content:center; margin-top:18px; }
</style>
</head>
<body>
<canvas id="matrix-bg"></canvas>
<div class="grid-overlay"></div>
<div class="scanlines"></div>
<div id="app"></div>

<script>
/* =====================================================================
   SETUP REQUIRED BEFORE THIS WORKS:
   1. Replace CLIENT_ID below with your own OAuth Client ID from
      Google Cloud Console (Credentials -> OAuth Client ID -> Web application).
   2. Host this file on a real https URL (e.g. GitHub Pages) and make sure
      that exact domain is added as an "Authorized JavaScript origin" in
      the same OAuth Client ID settings.
   ===================================================================== */
const CLIENT_ID = "PASTE_YOUR_CLIENT_ID_HERE.apps.googleusercontent.com";
const SCOPES = "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email";
const APP_PASSWORD = "9999";

/* ============ MATRIX RAIN BACKGROUND ============ */
(function(){
  const canvas = document.getElementById('matrix-bg');
  const ctx = canvas.getContext('2d');
  let w,h,cols,drops;
  const chars = "01アカサタナハマヤラワ01ABCDEF#$%&01";
  function resize(){
    w = canvas.width = window.innerWidth; h = canvas.height = window.innerHeight;
    cols = Math.floor(w/16); drops = new Array(cols).fill(1);
  }
  window.addEventListener('resize', resize); resize();
  function draw(){
    ctx.fillStyle = 'rgba(5,8,10,0.08)'; ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#39ff8a'; ctx.font = '14px monospace';
    for(let i=0;i<drops.length;i++){
      const text = chars[Math.floor(Math.random()*chars.length)];
      ctx.fillText(text, i*16, drops[i]*16);
      if(drops[i]*16 > h && Math.random() > 0.975) drops[i]=0;
      drops[i]++;
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

/* ============ STATE ============ */
let accessToken = null;
let tokenClient = null;
let userEmail = null;
let rootFolderId, currentFolderId, resignedFolderId;
let currentEmployees = [];
let resignedEmployees = [];
let view = "login";
let searchQueryCurrent = "";
let searchQueryResigned = "";

const app = document.getElementById('app');

function toast(msg, isErr){
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(()=> t.remove(), 3200);
}
function uid(){ return 'EMP-' + Date.now() + '-' + Math.floor(Math.random()*9000+1000); }

/* ============ GOOGLE SIGN-IN ============ */
function initGis(){
  if(CLIENT_ID.indexOf('PASTE_YOUR_CLIENT_ID_HERE') !== -1){
    console.warn('Set your real CLIENT_ID before using this app.');
  }
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp)=>{
      if(resp.error){ toast('Login failed: ' + resp.error, true); return; }
      accessToken = resp.access_token;
      await afterLogin();
    }
  });
}
window.addEventListener('load', ()=>{
  const check = setInterval(()=>{
    if(window.google && google.accounts && google.accounts.oauth2){
      clearInterval(check); initGis(); render();
    }
  }, 200);
});

function loginWithGoogle(){
  if(CLIENT_ID.indexOf('PASTE_YOUR_CLIENT_ID_HERE') !== -1){
    toast('CLIENT_ID is not set yet. Please add your Client ID in the code.', true);
    return;
  }
  if(!tokenClient){ toast('Google auth loading... try again in a second.', true); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function logoutFlow(){
  askPassword('Confirm Logout', ()=>{
    if(accessToken){ google.accounts.oauth2.revoke(accessToken, ()=>{}); }
    accessToken=null; userEmail=null; currentEmployees=[]; resignedEmployees=[];
    view='login'; render();
    toast('Logged out.');
  });
}

async function afterLogin(){
  view='loading'; render('Verifying your Google account...');
  try{
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers:{ Authorization:'Bearer '+accessToken } });
    const info = await res.json();
    if(!info.email || info.email.indexOf('@gmail.com') === -1){
      toast('Please sign in with an @gmail.com account.', true);
      accessToken = null; view='login'; render();
      return;
    }
    userEmail = info.email;
    view='loading'; render('Setting up Employee Record folders on Drive...');
    await setupDriveStructure();
    view='loading'; render('Loading employee records from Drive...');
    await loadAllFromDrive();
    view='dashboard'; render();
  }catch(e){
    console.error(e);
    toast('Something went wrong connecting to Google Drive.', true);
    view='login'; render();
  }
}

/* ============ DRIVE API HELPERS ============ */
async function driveFetch(url, options){
  options = options || {};
  options.headers = Object.assign({}, options.headers, { Authorization: 'Bearer ' + accessToken });
  const res = await fetch(url, options);
  if(res.status === 401){
    toast('Session expired. Please login again.', true);
    accessToken = null; view='login'; render();
    throw new Error('401 Unauthorized');
  }
  if(!res.ok){
    let detail = '';
    try{ const errJson = await res.clone().json(); detail = errJson?.error?.message || ''; }catch(e){}
    throw new Error('Drive API error ' + res.status + (detail ? (': ' + detail) : ''));
  }
  return res;
}

async function findFolder(name, parentId){
  const safe = name.replace(/'/g, "\\'");
  const q = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${safe}' and '${parentId}' in parents and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)`);
  const data = await res.json();
  return (data.files && data.files.length) ? data.files[0].id : null;
}
async function createFolder(name, parentId){
  const res = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, mimeType:'application/vnd.google-apps.folder', parents:[parentId] })
  });
  const data = await res.json();
  return data.id;
}
async function findOrCreateFolder(name, parentId){
  let id = await findFolder(name, parentId);
  if(!id) id = await createFolder(name, parentId);
  return id;
}
async function setupDriveStructure(){
  rootFolderId = await findOrCreateFolder('Employee Record', 'root');
  currentFolderId = await findOrCreateFolder('Current Employees', rootFolderId);
  resignedFolderId = await findOrCreateFolder('Resigned or Retired Employees', rootFolderId);
}

async function createFileWithContent(name, mimeType, parentId, content, isText){
  const metaRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ name, parents:[parentId] })
  });
  const meta = await metaRes.json();
  const fileId = meta.id;
  let body;
  if(isText){ body = content; } else { body = await (await fetch(content)).blob(); }
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method:'PATCH', headers:{'Content-Type': mimeType}, body
  });
  return fileId;
}
async function updateFileContent(fileId, mimeType, content, isText){
  let body;
  if(isText){ body = content; } else { body = await (await fetch(content)).blob(); }
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method:'PATCH', headers:{'Content-Type': mimeType}, body
  });
}
async function renameFile(fileId, newName){
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name:newName })
  });
}
async function moveFolder(folderId, fromParent, toParent){
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${folderId}?addParents=${toParent}&removeParents=${fromParent}`, { method:'PATCH' });
}
async function trashFolder(folderId){
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${folderId}`, {
    method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ trashed:true })
  });
}
async function listChildFolders(parentId){
  const q = encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=1000`);
  const data = await res.json();
  return data.files || [];
}
async function listChildFiles(parentId){
  const q = encodeURIComponent(`'${parentId}' in parents and trashed=false`);
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name,mimeType)&pageSize=100`);
  const data = await res.json();
  return data.files || [];
}
async function getFileText(fileId){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  return res.text();
}
async function getFileDataUrl(fileId){
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  const blob = await res.blob();
  return new Promise(resolve=>{
    const reader = new FileReader();
    reader.onload = ()=> resolve(reader.result);
    reader.readAsDataURL(blob);
  });
}

async function loadEmployeesFromFolder(parentId){
  const folders = await listChildFolders(parentId);
  const results = await Promise.all(folders.map(async (folder)=>{
    const children = await listChildFiles(folder.id);
    const profileFile = children.find(f=>f.name==='profile.json');
    const pictureFile = children.find(f=>f.name==='picture.jpg');
    const cnicFrontFile = children.find(f=>f.name==='cnic_front.jpg');
    const cnicBackFile = children.find(f=>f.name==='cnic_back.jpg');
    let data = {};
    if(profileFile){ try{ data = JSON.parse(await getFileText(profileFile.id)); }catch(e){} }
    data.folderId = folder.id;
    data.profileFileId = profileFile ? profileFile.id : null;
    data.pictureFileId = pictureFile ? pictureFile.id : null;
    data.cnicFrontFileId = cnicFrontFile ? cnicFrontFile.id : null;
    data.cnicBackFileId = cnicBackFile ? cnicBackFile.id : null;
    if(pictureFile) data.picture = await getFileDataUrl(pictureFile.id);
    if(cnicFrontFile) data.cnicFront = await getFileDataUrl(cnicFrontFile.id);
    if(cnicBackFile) data.cnicBack = await getFileDataUrl(cnicBackFile.id);
    if(!data.id) data.id = folder.id;
    return data;
  }));
  return results;
}
async function loadAllFromDrive(){
  currentEmployees = await loadEmployeesFromFolder(currentFolderId);
  resignedEmployees = await loadEmployeesFromFolder(resignedFolderId);
}

function folderNameFor(data){
  return (data.fullName || 'Unnamed') + ' - ' + (data.cnic || data.id);
}
function profileCopyOf(data){
  const c = Object.assign({}, data);
  delete c.picture; delete c.cnicFront; delete c.cnicBack;
  delete c._pictureChanged; delete c._cnicFrontChanged; delete c._cnicBackChanged;
  return c;
}
async function createEmployeeInDrive(data){
  const folderId = await createFolder(folderNameFor(data), currentFolderId);
  data.folderId = folderId;
  data.profileFileId = await createFileWithContent('profile.json','application/json', folderId, JSON.stringify(profileCopyOf(data)), true);
  if(data.picture) data.pictureFileId = await createFileWithContent('picture.jpg','image/jpeg', folderId, data.picture, false);
  if(data.cnicFront) data.cnicFrontFileId = await createFileWithContent('cnic_front.jpg','image/jpeg', folderId, data.cnicFront, false);
  if(data.cnicBack) data.cnicBackFileId = await createFileWithContent('cnic_back.jpg','image/jpeg', folderId, data.cnicBack, false);
  return data;
}
async function updateEmployeeInDrive(data){
  await renameFile(data.folderId, folderNameFor(data));
  if(data.profileFileId) await updateFileContent(data.profileFileId, 'application/json', JSON.stringify(profileCopyOf(data)), true);
  else data.profileFileId = await createFileWithContent('profile.json','application/json', data.folderId, JSON.stringify(profileCopyOf(data)), true);

  if(data._pictureChanged && data.picture){
    if(data.pictureFileId) await updateFileContent(data.pictureFileId, 'image/jpeg', data.picture, false);
    else data.pictureFileId = await createFileWithContent('picture.jpg','image/jpeg', data.folderId, data.picture, false);
  }
  if(data._cnicFrontChanged && data.cnicFront){
    if(data.cnicFrontFileId) await updateFileContent(data.cnicFrontFileId, 'image/jpeg', data.cnicFront, false);
    else data.cnicFrontFileId = await createFileWithContent('cnic_front.jpg','image/jpeg', data.folderId, data.cnicFront, false);
  }
  if(data._cnicBackChanged && data.cnicBack){
    if(data.cnicBackFileId) await updateFileContent(data.cnicBackFileId, 'image/jpeg', data.cnicBack, false);
    else data.cnicBackFileId = await createFileWithContent('cnic_back.jpg','image/jpeg', data.folderId, data.cnicBack, false);
  }
  delete data._pictureChanged; delete data._cnicFrontChanged; delete data._cnicBackChanged;
}

/* ============ PASSWORD GATE ============ */
function askPassword(actionLabel, onSuccess){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="panel pw-modal-box">
      <div class="eyebrow">SECURITY CHECK</div>
      <h3 class="glow" style="margin:8px 0 16px;font-size:16px;">${actionLabel}</h3>
      <div class="field"><input type="password" id="pw-input" placeholder="Enter password" autocomplete="off"></div>
      <div id="pw-err" style="color:var(--red);font-size:11px;min-height:14px;margin-bottom:10px;"></div>
      <div style="display:flex;gap:10px;justify-content:center;">
        <button class="btn cyan" id="pw-cancel">Cancel</button>
        <button class="btn" id="pw-confirm">Confirm</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  const input = overlay.querySelector('#pw-input');
  input.focus();
  function confirmFn(){
    if(input.value === APP_PASSWORD){ overlay.remove(); onSuccess(); }
    else { overlay.querySelector('#pw-err').textContent = 'Incorrect password.'; input.value=''; input.focus(); }
  }
  overlay.querySelector('#pw-confirm').onclick = confirmFn;
  overlay.querySelector('#pw-cancel').onclick = ()=> overlay.remove();
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') confirmFn(); });
}

/* ============ IMAGE COMPRESSION ============ */
function compressImage(file, maxW, quality){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (e)=>{
      const img = new Image();
      img.onload = ()=>{
        let w = img.width, h = img.height;
        if(w > maxW){ h = Math.round(h * (maxW/w)); w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img,0,0,w,h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function wireFormInteractions(store){
  document.getElementById('f-qualification').addEventListener('change', e=>{
    document.getElementById('qual-detail-wrap').classList.toggle('hidden', e.target.value !== 'Graduation Continue');
  });
  document.querySelectorAll('input[name="f-relStatus"]').forEach(r=>r.addEventListener('change', ()=>{
    document.getElementById('children-wrap').classList.toggle('hidden', document.querySelector('input[name="f-relStatus"]:checked')?.value !== 'Married');
  }));
  document.querySelectorAll('input[name="f-illness"]').forEach(r=>r.addEventListener('change', ()=>{
    document.getElementById('illness-detail-wrap').classList.toggle('hidden', document.querySelector('input[name="f-illness"]:checked')?.value !== 'Yes');
  }));
  document.querySelectorAll('input[name="f-crime"]').forEach(r=>r.addEventListener('change', ()=>{
    document.getElementById('crime-detail-wrap').classList.toggle('hidden', document.querySelector('input[name="f-crime"]:checked')?.value !== 'Yes');
  }));
  document.querySelectorAll('input[name="f-prevExp"]').forEach(r=>r.addEventListener('change', ()=>{
    document.getElementById('prevexp-detail-wrap').classList.toggle('hidden', document.querySelector('input[name="f-prevExp"]:checked')?.value !== 'Yes');
  }));
  function wireUpload(boxId, inputId, previewId, storeKey, changedFlag, maxW, quality){
    document.getElementById(boxId).onclick = ()=> document.getElementById(inputId).click();
    document.getElementById(inputId).addEventListener('change', async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      try{
        const dataUrl = await compressImage(file, maxW, quality);
        store[storeKey] = dataUrl;
        store[changedFlag] = true;
        const prev = document.getElementById(previewId);
        prev.src = dataUrl; prev.classList.remove('hidden');
      }catch(err){ toast('Could not read image.', true); }
    });
  }
  wireUpload('pic-box','f-picture','pic-preview', 'picture', '_pictureChanged', 500, 0.7);
  wireUpload('cnicf-box','f-cnicFront','cnicf-preview', 'cnicFront', '_cnicFrontChanged', 700, 0.6);
  wireUpload('cnicb-box','f-cnicBack','cnicb-preview', 'cnicBack', '_cnicBackChanged', 700, 0.6);
}
function collectFormData(existing){
  const val = id => document.getElementById(id).value.trim();
  const radio = name => document.querySelector(`input[name="${name}"]:checked`)?.value || '';
  const data = Object.assign({}, existing || {});
  data.position = val('f-position'); data.fullName = val('f-fullName'); data.fatherName = val('f-fatherName');
  data.cnic = val('f-cnic'); data.fatherCnic = val('f-fatherCnic'); data.dob = val('f-dob');
  data.qualification = document.getElementById('f-qualification').value;
  data.qualificationDetail = val('f-qualificationDetail');
  data.gender = radio('f-gender'); data.salary = val('f-salary'); data.joiningDate = val('f-joiningDate');
  data.relationshipStatus = radio('f-relStatus'); data.childrenCount = val('f-childrenCount');
  data.permanentAddress = val('f-permAddress'); data.temporaryAddress = val('f-tempAddress');
  data.illness = radio('f-illness'); data.illnessDetail = val('f-illnessDetail');
  data.crimeRecord = radio('f-crime'); data.crimeDetail = val('f-crimeDetail');
  data.previousExperience = radio('f-prevExp'); data.prevExpDetail = val('f-prevExpDetail');
  data.prevSalary = val('f-prevSalary'); data.prevReason = val('f-prevReason');
  data.courses = val('f-courses'); data.skills = val('f-skills');
  return data;
}
function validateForm(data){
  const missing = [];
  if(!data.position) missing.push('Position');
  if(!data.dob) missing.push('Date of Birth');
  if(!data.qualification) missing.push('Qualification');
  if(data.qualification === 'Graduation Continue' && !data.qualificationDetail) missing.push('Qualification Detail');
  if(!data.joiningDate) missing.push('Joining Date');
  if(!data.permanentAddress) missing.push('Permanent Address');
  if(!data.temporaryAddress) missing.push('Temporary Address');
  if(!data.previousExperience) missing.push('Previous Experience (Yes/No)');
  if(data.previousExperience === 'Yes'){
    if(!data.prevExpDetail) missing.push('Experience Detail');
    if(!data.prevSalary) missing.push('Previous Salary');
    if(!data.prevReason) missing.push('Reason for Leaving');
  }
  if(!data.picture) missing.push('Picture Upload');
  if(!data.cnicFront) missing.push('CNIC Front Upload');
  if(!data.cnicBack) missing.push('CNIC Back Upload');
  return missing;
}

function fileGridHTML(list, statusClass){
  if(!list.length) return `<div class="empty-note panel">No records yet.</div>`;
  return `<div class="file-grid">` + list.map(emp=>`
    <div class="panel file-card" data-id="${emp.id}">
      ${emp.picture ? `<img class="file-thumb" src="${emp.picture}">` : `<div class="file-thumb placeholder">👤</div>`}
      <div class="file-name">${emp.fullName || '(no name)'}</div>
      <div class="file-id">${emp.cnic || emp.id}</div>
      <div class="file-status ${statusClass}">${emp.status === 'current' ? 'Active' : (emp.exitType || 'Resigned/Retired')}</div>
    </div>`).join('') + `</div>`;
}
function filterList(list, query){
  if(!query) return list;
  const q = query.toLowerCase();
  return list.filter(e => (e.fullName||'').toLowerCase().includes(q) || (e.cnic||'').toLowerCase().includes(q));
}

  document.body.appendChild(overlay);
  document.getElementById('detail-close').onclick = ()=> overlay.remove();
  document.getElementById('edit-btn').onclick = ()=> askPassword('Enter password to edit this record', ()=>{ overlay.remove(); openEditForm(emp, source); });
  document.getElementById('delete-btn').onclick = ()=> askPassword('Enter password to permanently delete this record', ()=>{
    if(!confirm('This will send "' + (emp.fullName||'this record') + '" to Google Drive Trash. Continue?')) return;
    trashFolder(emp.folderId).then(()=>{
      const arr = source==='current' ? currentEmployees : resignedEmployees;
      const idx = arr.findIndex(e=>e.id===id);
      if(idx>-1) arr.splice(idx,1);
      overlay.remove(); toast('Record moved to Drive Trash.'); render();
    }).catch(()=> toast('Delete failed.', true));
  });
  if(source==='current'){
    document.getElementById('resign-btn').onclick = ()=> askPassword('Enter password to change employee status', ()=>{ overlay.remove(); openResignDialog(emp); });
  } else {
    document.getElementById('reactivate-btn').onclick = ()=> askPassword('Enter password to reactivate this employee', async ()=>{
      try{
        await moveFolder(emp.folderId, resignedFolderId, currentFolderId);
        const idx = resignedEmployees.findIndex(e=>e.id===id);
        if(idx>-1){
          const [moved] = resignedEmployees.splice(idx,1);
          moved.status='current'; delete moved.exitType; delete moved.exitDate; delete moved.exitNote;
          moved._pictureChanged=false;
          await updateFileContent(moved.profileFileId, 'application/json', JSON.stringify(profileCopyOf(moved)), true);
          currentEmployees.push(moved);
        }
        overlay.remove(); toast('Employee reactivated to Current.'); view='current'; render();
      }catch(e){ toast('Reactivate failed.', true); }
    });
  }
}
function openResignDialog(emp){
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="panel pw-modal-box" style="max-width:420px;text-align:left;">
      <div class="eyebrow">STATUS CHANGE</div>
      <h3 style="margin:8px 0 16px;">${emp.fullName}</h3>
      <div class="field"><label>Type</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="exit-type" value="Resigned" checked> Resigned</label>
          <label class="radio-opt"><input type="radio" name="exit-type" value="Retired"> Retired</label>
        </div>
      </div>
      <div class="field"><label>Date</label><input type="date" id="exit-date"></div>
      <div class="field"><label>Note (optional)</label><textarea id="exit-note" rows="2"></textarea></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn cyan" id="exit-cancel">Cancel</button>
        <button class="btn amber" id="exit-confirm">Confirm</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#exit-cancel').onclick = ()=> overlay.remove();
  overlay.querySelector('#exit-confirm').onclick = async ()=>{
    const type = overlay.querySelector('input[name="exit-type"]:checked').value;
    const date = overlay.querySelector('#exit-date').value;
    const note = overlay.querySelector('#exit-note').value.trim();
    const btn = overlay.querySelector('#exit-confirm');
    btn.disabled = true; btn.textContent = 'Moving...';
    try{
      await moveFolder(emp.folderId, currentFolderId, resignedFolderId);
      const idx = currentEmployees.findIndex(e=>e.id===emp.id);
      if(idx>-1){
        const [moved] = currentEmployees.splice(idx,1);
        moved.status='resigned'; moved.exitType=type; moved.exitDate=date; moved.exitNote=note;
        await updateFileContent(moved.profileFileId, 'application/json', JSON.stringify(profileCopyOf(moved)), true);
        resignedEmployees.push(moved);
      }
      overlay.remove(); toast(emp.fullName + ' moved to Resigned/Retired.'); view='resigned'; render();
    }catch(e){ toast('Status change failed.', true); btn.disabled=false; btn.textContent='Confirm'; }
  };
}
function openEditForm(emp, source){
  const store = Object.assign({}, emp);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="panel modal-box">
      <span class="modal-close" id="edit-close">&times;</span>
      <div class="eyebrow">EDIT RECORD</div>
      <h2 class="glow" style="margin:6px 0 16px;">${emp.fullName || '(no name)'}</h2>
      ${formFieldsHTML(emp)}
      <div class="form-actions">
        <button class="btn" id="save-edit-btn">Save Changes</button>
        <button class="btn cyan" id="cancel-edit-btn">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  wireFormInteractions(store);
  overlay.querySelector('#edit-close').onclick = ()=> overlay.remove();
  overlay.querySelector('#cancel-edit-btn').onclick = ()=> overlay.remove();
  overlay.querySelector('#save-edit-btn').onclick = async ()=>{
    const data = collectFormData(store);
    const missing = validateForm(data);
    if(missing.length){ toast('Missing: ' + missing.join(', '), true); return; }
    data.id = emp.id; data.status = emp.status;
    data.folderId = emp.folderId; data.profileFileId = emp.profileFileId;
    data.pictureFileId = emp.pictureFileId; data.cnicFrontFileId = emp.cnicFrontFileId; data.cnicBackFileId = emp.cnicBackFileId;
    if(source==='resigned'){ data.exitType=emp.exitType; data.exitDate=emp.exitDate; data.exitNote=emp.exitNote; }
    const btn = overlay.querySelector('#save-edit-btn');
    btn.disabled = true; btn.textContent = 'Saving to Drive...';
    try{
      await updateEmployeeInDrive(data);
      const arr = source==='current' ? currentEmployees : resignedEmployees;
      const idx = arr.findIndex(e=>e.id===emp.id);
      if(idx>-1) arr[idx] = data;
      overlay.remove(); toast('Record updated on Drive.'); render();
    }catch(e){ toast('Update failed.', true); btn.disabled=false; btn.textContent='Save Changes'; }
  };
}

/* ============ MASTER RENDER ============ */
function render(loadingMsg){
  if(view==='login') renderLogin();
  else if(view==='loading') renderLoading(loadingMsg);
  else if(view==='dashboard') renderDashboard();
  else if(view==='new') renderNewEmployee();
  else if(view==='current') renderCurrentList();
  else if(view==='resigned') renderResignedList();
}
render();
</script>
</body>
</html>
