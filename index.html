<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OPTP - Employee Record System </title>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --bg: #05080a;
    --panel: #0b1315;
    --panel2: #0f1a1c;
    --line: #173a2e;
    --green: #39ff8a;
    --green-dim: #1c8a52;
    --cyan: #23d5f0;
    --amber: #ffb020;
    --red: #ff3b5c;
    --text: #cdeee0;
    --text-dim: #6f9686;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; background: var(--bg); }
  body { font-family: ui-monospace, 'Consolas', 'Courier New', monospace; color: var(--text); overflow-x: hidden; }
  #matrix-bg { position: fixed; inset: 0; z-index: 0; opacity: 0.35; }
  .scanlines { position: fixed; inset: 0; z-index: 1; pointer-events: none; background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px, rgba(0,0,0,0.35) 3px, rgba(0,0,0,0) 4px); mix-blend-mode: overlay; }
  .grid-overlay { position: fixed; inset: 0; z-index: 0; pointer-events: none; background-image: linear-gradient(rgba(35,213,240,0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(35,213,240,0.05) 1px, transparent 1px); background-size: 42px 42px; }
  #app { position: relative; z-index: 2; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px 60px; }
  .eyebrow { font-size: 11px; letter-spacing: 3px; color: var(--green-dim); text-transform: uppercase; }
  h1, h2, h3 { font-weight: 600; letter-spacing: 1px; margin: 0; }
  .glow { text-shadow: 0 0 8px rgba(57,255,138,0.55), 0 0 18px rgba(57,255,138,0.25); }
  .panel { background: linear-gradient(180deg, var(--panel) 0%, var(--panel2) 100%); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 0 0 1px rgba(57,255,138,0.03), 0 8px 30px rgba(0,0,0,0.6); position: relative; }
  .panel::before { content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent, var(--green), transparent); opacity: 0.6; }
  .btn { font-family: inherit; cursor: pointer; border-radius: 4px; border: 1px solid var(--green-dim); background: rgba(57,255,138,0.06); color: var(--green); padding: 10px 18px; font-size: 13px; letter-spacing: 1px; text-transform: uppercase; transition: all .15s ease; }
  .btn:hover { background: rgba(57,255,138,0.16); box-shadow: 0 0 14px rgba(57,255,138,0.25); }
  .btn:active { transform: scale(0.97); }
  .btn.cyan { border-color: #0f6a7d; color: var(--cyan); background: rgba(35,213,240,0.06); }
  .btn.cyan:hover { background: rgba(35,213,240,0.16); box-shadow: 0 0 14px rgba(35,213,240,0.25); }
  .btn.amber { border-color: #8a5f10; color: var(--amber); background: rgba(255,176,32,0.06); }
  .btn.amber:hover { background: rgba(255,176,32,0.16); box-shadow: 0 0 14px rgba(255,176,32,0.25); }
  .btn.red { border-color: #8a1c30; color: var(--red); background: rgba(255,59,92,0.06); }
  .btn.red:hover { background: rgba(255,59,92,0.16); box-shadow: 0 0 14px rgba(255,59,92,0.25); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  input, select, textarea { font-family: inherit; background: #081010; border: 1px solid var(--line); color: var(--text); border-radius: 4px; padding: 9px 10px; font-size: 13.5px; width: 100%; outline: none; }
  input:focus, select:focus, textarea:focus { border-color: var(--green-dim); box-shadow: 0 0 0 2px rgba(57,255,138,0.12); }
  label { font-size: 12px; color: var(--text-dim); letter-spacing: 0.5px; display: block; margin-bottom: 5px; }
  .req::after { content: " *"; color: var(--red); }
  .field { margin-bottom: 14px; }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .row > .field { flex: 1; min-width: 220px; }
  .radio-group { display: flex; gap: 16px; flex-wrap: wrap; margin-top: 4px; }
  .radio-opt { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text); cursor: pointer; }
  .radio-opt input { width: auto; accent-color: var(--green); }
  .hidden { display: none !important; }
  #login-screen { width: 100%; max-width: 440px; margin-top: 8vh; }
  .login-box { padding: 34px 30px; text-align: center; }
  .term-cursor::after { content: "█"; animation: blink 1s step-end infinite; color: var(--green); }
  @keyframes blink { 50% { opacity: 0; } }
  #topbar { width: 100%; max-width: 1180px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 22px; padding-bottom: 14px; border-bottom: 1px solid var(--line); }
  #topbar .who { font-size: 12px; color: var(--text-dim); }
  #topbar .who b { color: var(--green); }
  #main-wrap { width: 100%; max-width: 1180px; }
  .dash-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-top: 8px; }
  @media(max-width: 860px) { .dash-grid { grid-template-columns: 1fr; } }
  .dash-card { padding: 26px 22px; cursor: pointer; transition: all .2s ease; }
  .dash-card:hover { border-color: var(--green-dim); transform: translateY(-3px); box-shadow: 0 12px 30px rgba(0,0,0,0.6), 0 0 20px rgba(57,255,138,0.12); }
  .dash-card .icon { font-size: 26px; margin-bottom: 10px; }
  .dash-card .count { font-size: 32px; color: var(--green); margin: 8px 0 4px; }
  .dash-card .lbl { font-size: 13px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; }
  .search-bar { display: flex; gap: 10px; margin: 18px 0; }
  .search-bar input { flex: 1; }
  .file-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; margin-top: 16px; }
  .file-card { padding: 14px 10px 12px; text-align: center; cursor: pointer; }
  .file-card:hover { border-color: var(--green-dim); box-shadow: 0 0 16px rgba(57,255,138,0.15); }
  .file-thumb { width: 74px; height: 74px; border-radius: 6px; object-fit: cover; margin: 0 auto 10px; border: 1px solid var(--line); display: block; background: #081010; }
  .file-thumb.lazy-thumb { object-fit: cover; }
  .file-thumb.placeholder { display: flex; align-items: center; justify-content: center; font-size: 26px; color: var(--text-dim); }
  .file-name { font-size: 12.5px; color: var(--text); word-break: break-word; }
  .file-id { font-size: 10.5px; color: var(--text-dim); margin-top: 3px; }
  .file-status { font-size: 9.5px; letter-spacing: 1px; margin-top: 6px; text-transform: uppercase; }
  .file-status.active { color: var(--green); }
  .file-status.gone { color: var(--amber); }
  .empty-note { color: var(--text-dim); font-size: 13px; padding: 30px; text-align: center; }
  .modal-overlay { position: fixed; inset: 0; background: rgba(2,4,4,0.82); z-index: 50; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; padding: 40px 14px; }
  .modal-box { width: 100%; max-width: 760px; padding: 26px 26px 30px; }
  .modal-close { float: right; cursor: pointer; color: var(--text-dim); font-size: 20px; line-height: 1; }
  .modal-close:hover { color: var(--red); }
  .detail-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 24px; margin: 16px 0; font-size: 13px; }
  @media(max-width: 600px) { .detail-grid { grid-template-columns: 1fr; } }
  .detail-item .k { color: var(--text-dim); font-size: 11px; letter-spacing: 1px; text-transform: uppercase; }
  .detail-item .v { color: var(--text); margin-top: 2px; }
  .doc-thumbs { display: flex; gap: 14px; margin: 16px 0; flex-wrap: wrap; }
  .doc-thumbs img { width: 120px; height: 80px; object-fit: cover; border: 1px solid var(--line); border-radius: 4px; }
  .doc-thumbs .lbl { font-size: 10px; color: var(--text-dim); text-align: center; margin-top: 4px; }
  .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; border-top: 1px solid var(--line); padding-top: 18px; }
  .upload-box { border: 1px dashed var(--line); border-radius: 6px; padding: 14px; text-align: center; cursor: pointer; font-size: 12px; color: var(--text-dim); }
  .upload-box:hover { border-color: var(--green-dim); color: var(--green); }
  .upload-preview { width: 90px; height: 90px; object-fit: cover; border-radius: 6px; margin: 8px auto 0; display: block; border: 1px solid var(--line); }
  .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); background: #081010; border: 1px solid var(--green-dim); color: var(--green); padding: 12px 20px; border-radius: 6px; font-size: 13px; z-index: 100; box-shadow: 0 0 20px rgba(57,255,138,0.2); animation: toastIn .2s ease; max-width: 90vw; }
  .toast.err { border-color: #8a1c30; color: var(--red); box-shadow: 0 0 20px rgba(255,59,92,0.2); }
  @keyframes toastIn { from { opacity: 0; transform: translate(-50%,10px); } to { opacity: 1; transform: translate(-50%,0); } }
  .section-title { display: flex; align-items: center; gap: 10px; margin-bottom: 6px; }
  .back-link { font-size: 12px; color: var(--cyan); cursor: pointer; }
  .form-panel { padding: 24px; margin-top: 16px; }
  .subhead { font-size: 12px; color: var(--green); letter-spacing: 2px; text-transform: uppercase; margin: 22px 0 12px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
  .form-actions { display: flex; gap: 10px; margin-top: 20px; }
  .pw-modal-box { max-width: 340px; padding: 26px; text-align: center; }
  .stat-line { font-size: 11px; color: var(--text-dim); margin-top: 4px; }
  #loading-screen { width: 100%; max-width: 420px; margin-top: 20vh; text-align: center; }
  .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--green); border-radius: 50%; animation: spin 0.9s linear infinite; margin: 18px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gsi-btn-wrap { display: flex; justify-content: center; margin-top: 18px; }
</style>
</head>
<body>
<canvas id="matrix-bg"></canvas>
<div class="grid-overlay"></div>
<div class="scanlines"></div>
<div id="app"></div>

<script>
const CONFIG = Object.freeze({
  CLIENT_ID: "936109847577-ajbaefe746dalhe6vn7ae0u2pdl26sds.apps.googleusercontent.com",
  SCOPES: "https://www.googleapis.com/auth/drive.file https://www.googleapis.com/auth/userinfo.email",
  // IMPORTANT: replace the placeholder below with the exact Gmail account(s) allowed to use this app.
  // Example: AUTHORIZED_EMAILS: ["manager@example.com", "admin@example.com"]
  AUTHORIZED_EMAILS: ["shahzaibafzalsa3697559@gmail.com", "optpscheme3@gmail.com"],
  SESSION_EMAIL_KEY: "optp_authorized_email_v2",
  TOKEN_REFRESH_TIMEOUT_MS: 7000,
  MAX_IMAGE_CACHE_ITEMS: 60
});
const CLIENT_ID = CONFIG.CLIENT_ID;
const SCOPES = CONFIG.SCOPES;

document.getElementById('matrix-bg').style.display = 'none';

let accessToken = null;
let tokenClient = null;
let userEmail = null;
let rootFolderId, currentFolderId, resignedFolderId;
let currentEmployees = [];
let resignedEmployees = [];
let view = "login";
let searchQueryCurrent = "";
let searchQueryResigned = "";
let silentAttemptInProgress = false;
let silentAttemptEmail = null;
const assetCache = new Map();
const assetPromises = new Map();

const app = document.getElementById('app');

function esc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

function toast(msg, isErr) {
  const t = document.createElement('div');
  t.className = 'toast' + (isErr ? ' err' : '');
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3200);
}

function uid() {
  return 'EMP-' + Date.now() + '-' + Math.floor(Math.random() * 9000 + 1000);
}

function saveSession(email) {
  try { sessionStorage.setItem(CONFIG.SESSION_EMAIL_KEY, email || ''); } catch(e) {}
}

function loadSessionEmail() {
  try { return sessionStorage.getItem(CONFIG.SESSION_EMAIL_KEY) || ''; } catch(e) { return ''; }
}

function clearSession() {
  try { sessionStorage.removeItem(CONFIG.SESSION_EMAIL_KEY); } catch(e) {}
}

function isAuthorizedEmail(email) {
  const normalized = String(email || '').trim().toLowerCase();
  return CONFIG.AUTHORIZED_EMAILS.some(x => String(x).trim().toLowerCase() === normalized);
}

function assertConfigured() {
  return CONFIG.AUTHORIZED_EMAILS.length > 0 && !CONFIG.AUTHORIZED_EMAILS.includes('REPLACE-WITH-AUTHORIZED-EMAIL@gmail.com');
}

function initGis() {
  tokenClient = google.accounts.oauth2.initTokenClient({
    client_id: CLIENT_ID,
    scope: SCOPES,
    callback: async (resp) => {
      const wasSilent = silentAttemptInProgress;
      const expectedEmail = silentAttemptEmail;
      silentAttemptInProgress = false;
      silentAttemptEmail = null;
      if (resp.error) {
        if (wasSilent) { view = 'login'; render(); return; }
        toast('Login failed: ' + resp.error, true);
        return;
      }
      accessToken = resp.access_token;
      await afterLogin(wasSilent, expectedEmail, resp.expires_in);
    }
  });
}

window.addEventListener('load', () => {
  const check = setInterval(() => {
    if (window.google && google.accounts && google.accounts.oauth2) {
      clearInterval(check);
      initGis();
      const savedEmail = loadSessionEmail();
      view = savedEmail ? 'loading' : 'login';
      render(savedEmail ? 'Restoring Google session...' : undefined);
      if (savedEmail) attemptSilentLogin(savedEmail);
    }
  }, 150);
});

async function attemptSilentLogin(savedEmail) {
  if (!isAuthorizedEmail(savedEmail)) { clearSession(); view = 'login'; render(); return; }
  silentAttemptInProgress = true;
  silentAttemptEmail = savedEmail;
  let settled = false;
  const fallbackTimer = setTimeout(() => {
    if (!settled) { settled = true; silentAttemptInProgress = false; silentAttemptEmail = null; view = 'login'; render(); }
  }, CONFIG.TOKEN_REFRESH_TIMEOUT_MS);
  const originalCallback = tokenClient.callback;
  tokenClient.callback = (resp) => {
    settled = true; clearTimeout(fallbackTimer); tokenClient.callback = originalCallback; originalCallback(resp);
  };
  try { tokenClient.requestAccessToken({ prompt: 'none', hint: savedEmail }); }
  catch(e) { if (!settled) { settled = true; clearTimeout(fallbackTimer); tokenClient.callback = originalCallback; silentAttemptInProgress = false; silentAttemptEmail = null; view = 'login'; render(); } }
}

function loginWithGoogle() {
  if (!assertConfigured()) {
    toast('Set AUTHORIZED_EMAILS in CONFIG before using the system.', true);
    return;
  }
  if (!tokenClient) { toast('Authentication service initializing...', true); return; }
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

function logoutFlow() {
  if (!confirm('Log out from the Employee Record System?')) return;
  if (accessToken) { try { google.accounts.oauth2.revoke(accessToken, () => {}); } catch(e) {} }
  clearSession(); accessToken = null; userEmail = null; currentEmployees = []; resignedEmployees = []; assetCache.clear();
  view = 'login'; render(); toast('Logged out.');
}

async function afterLogin(isSilent, expectedEmail, expiresInSeconds, isFromCache) {
  view = 'loading'; render('Verifying Google account...');
  try {
    const res = await fetch('https://www.googleapis.com/oauth2/v3/userinfo', { headers: { Authorization: 'Bearer ' + accessToken } });
    if (!res.ok) { accessToken = null; view = 'login'; render(); if (!isSilent) toast('Google session could not be verified.', true); return; }
    const info = await res.json();
    const email = String(info.email || '').trim().toLowerCase();
    if (!email || !isAuthorizedEmail(email)) {
      try { google.accounts.oauth2.revoke(accessToken, () => {}); } catch(e) {}
      clearSession(); accessToken = null; userEmail = null; view = 'login'; render();
      toast('This Google account is not authorized for this system.', true); return;
    }
    if (isSilent && expectedEmail && email !== String(expectedEmail).toLowerCase()) {
      clearSession(); accessToken = null; userEmail = null; view = 'login'; render(); return;
    }
    userEmail = email; saveSession(email);
    view = 'loading'; render('Configuring Storage Folders...'); await setupDriveStructure();
    view = 'loading'; render('Loading employee records...'); await loadAllFromDrive();
    view = 'dashboard'; render();
  } catch(e) {
    console.error(e);
    if (isSilent) { accessToken = null; view = 'login'; render(); return; }
    toast('Connection error with Google Drive.', true); view = 'login'; render();
  }
}

function silentRefreshToken() {
  return new Promise((resolve) => {
    if (!tokenClient || !userEmail) { resolve(false); return; }
    let settled = false;
    const fallbackTimer = setTimeout(() => { if (!settled) { settled = true; resolve(false); } }, CONFIG.TOKEN_REFRESH_TIMEOUT_MS);
    const originalCallback = tokenClient.callback;
    tokenClient.callback = (resp) => {
      settled = true; clearTimeout(fallbackTimer); tokenClient.callback = originalCallback;
      if (resp.error) { resolve(false); return; }
      accessToken = resp.access_token; resolve(true);
    };
    try { tokenClient.requestAccessToken({ prompt: 'none', hint: userEmail }); }
    catch(e) { if (!settled) { settled = true; clearTimeout(fallbackTimer); tokenClient.callback = originalCallback; resolve(false); } }
  });
}

async function driveFetch(url, options, _isRetry) {
  options = options || {};
  const headers = Object.assign({}, options.headers || {}, {
    Authorization: 'Bearer ' + accessToken
  });
  const requestOptions = Object.assign({}, options, { headers });
  const res = await fetch(url, requestOptions);

  if (res.status === 401) {
    if (!_isRetry) {
      const refreshed = await silentRefreshToken();
      if (refreshed) return driveFetch(url, options, true);
    }
    clearSession();
    accessToken = null;
    userEmail = null;
    currentEmployees = [];
    resignedEmployees = [];
    view = 'login';
    render();
    throw new Error('401 Unauthorized');
  }

  if (res.status === 429 || res.status === 503) {
    if (!_isRetry) {
      const retryAfter = Number(res.headers.get('Retry-After') || 1);
      await new Promise(r => setTimeout(r, Math.min(5000, Math.max(500, retryAfter * 1000))));
      return driveFetch(url, options, true);
    }
  }
  if (!res.ok) {
    let detail = '';
    try { const errJson = await res.clone().json(); detail = errJson?.error?.message || errJson?.error?.status || ''; } catch(e) {}
    throw new Error('Drive API status ' + res.status + (detail ? ': ' + detail : ''));
  }
  return res;
}

async function findFolder(name, parentId) {
  const safe = name.replace(/'/g, "\\'");
  const q = encodeURIComponent(
    `mimeType='application/vnd.google-apps.folder' and name='${safe}' and '${parentId}' in parents and trashed=false`
  );
  const res = await driveFetch(
    `https://www.googleapis.com/drive/v3/files?q=${q}&fields=files(id,name)&pageSize=100`
  );
  const data = await res.json();
  return (data.files && data.files.length) ? data.files[0].id : null;
}

async function createFolder(name, parentId) {
  const res = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, mimeType: 'application/vnd.google-apps.folder', parents: [parentId] })
  });
  const data = await res.json();
  return data.id;
}

async function findOrCreateFolder(name, parentId) {
  let id = await findFolder(name, parentId);
  if (!id) id = await createFolder(name, parentId);
  return id;
}

async function setupDriveStructure() {
  rootFolderId = await findOrCreateFolder('OPTP Employee Record', 'root');
  currentFolderId = await findOrCreateFolder('Current Employees', rootFolderId);
  resignedFolderId = await findOrCreateFolder('Resigned or Retired Employees', rootFolderId);
}

async function createFileWithContent(name, mimeType, parentId, content, isText) {
  const metaRes = await driveFetch('https://www.googleapis.com/drive/v3/files', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, parents: [parentId] })
  });
  const meta = await metaRes.json();
  const fileId = meta.id;
  const body = isText ? content : await (await fetch(content)).blob();
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { 'Content-Type': mimeType },
    body
  });
  return fileId;
}

async function updateFileContent(fileId, mimeType, content, isText) {
  const body = isText ? content : await (await fetch(content)).blob();
  await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${fileId}?uploadType=media`, {
    method: 'PATCH',
    headers: { 'Content-Type': mimeType },
    body
  });
}

async function renameFile(fileId, newName) {
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: newName })
  });
}

async function moveFolder(folderId, fromParent, toParent) {
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${folderId}?addParents=${toParent}&removeParents=${fromParent}`, { method: 'PATCH' });
}

async function trashFolder(folderId) {
  await driveFetch(`https://www.googleapis.com/drive/v3/files/${folderId}`, {
    method: 'PATCH',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ trashed: true })
  });
}

async function listAllDriveFiles(q, fields) {
  const all = [];
  let pageToken = '';
  do {
    const params = new URLSearchParams({
      q,
      fields: 'nextPageToken,files(' + fields + ')',
      pageSize: '1000',
      orderBy: 'name_natural'
    });
    if (pageToken) params.set('pageToken', pageToken);
    const res = await driveFetch('https://www.googleapis.com/drive/v3/files?' + params.toString());
    const data = await res.json();
    if (Array.isArray(data.files)) all.push(...data.files);
    pageToken = data.nextPageToken || '';
  } while (pageToken);
  return all;
}

async function listChildFolders(parentId) {
  return listAllDriveFiles(
    `mimeType='application/vnd.google-apps.folder' and '${parentId}' in parents and trashed=false`,
    'id,name'
  );
}

async function listChildFiles(parentId) {
  return listAllDriveFiles(
    `'${parentId}' in parents and trashed=false`,
    'id,name,mimeType'
  );
}

async function getFileText(fileId) {
  const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${fileId}?alt=media`);
  return res.text();
}

async function getFileDataUrl(fileId) {
  if (!fileId) return '';
  if (assetCache.has(fileId)) return assetCache.get(fileId);
  if (assetPromises.has(fileId)) return assetPromises.get(fileId);
  const promise = (async () => {
    const res = await driveFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(fileId)}?alt=media`);
    const blob = await res.blob();
    const dataUrl = await new Promise((resolve, reject) => {
      const reader = new FileReader(); reader.onload = () => resolve(reader.result); reader.onerror = reject; reader.readAsDataURL(blob);
    });
    assetCache.set(fileId, dataUrl);
    while (assetCache.size > CONFIG.MAX_IMAGE_CACHE_ITEMS) assetCache.delete(assetCache.keys().next().value);
    assetPromises.delete(fileId);
    return dataUrl;
  })().catch(err => { assetPromises.delete(fileId); throw err; });
  assetPromises.set(fileId, promise);
  return promise;
}

async function loadEmployeeAssets(emp, includeAll = true) {
  const tasks = [];
  if (emp.pictureFileId && !emp.picture) tasks.push(getFileDataUrl(emp.pictureFileId).then(v => emp.picture = v));
  if (includeAll && emp.cnicFrontFileId && !emp.cnicFront) tasks.push(getFileDataUrl(emp.cnicFrontFileId).then(v => emp.cnicFront = v));
  if (includeAll && emp.cnicBackFileId && !emp.cnicBack) tasks.push(getFileDataUrl(emp.cnicBackFileId).then(v => emp.cnicBack = v));
  await Promise.all(tasks);
  return emp;
}

async function loadEmployeesFromFolder(parentId) {
  const folders = await listChildFolders(parentId);
  const results = [];
  const concurrency = 5;
  for (let i = 0; i < folders.length; i += concurrency) {
    const batch = folders.slice(i, i + concurrency);
    const batchResults = await Promise.all(batch.map(async folder => {
      const children = await listChildFiles(folder.id);
      const profileFile = children.find(f => f.name === 'profile.json');
      const pictureFile = children.find(f => f.name === 'picture.jpg');
      const cnicFrontFile = children.find(f => f.name === 'cnic_front.jpg');
      const cnicBackFile = children.find(f => f.name === 'cnic_back.jpg');
      let data = {};
      if (profileFile) { try { data = JSON.parse(await getFileText(profileFile.id)); } catch(e) { console.warn('Invalid profile.json:', folder.id, e); } }
      data.folderId = folder.id;
      data.profileFileId = profileFile ? profileFile.id : null;
      data.pictureFileId = pictureFile ? pictureFile.id : null;
      data.cnicFrontFileId = cnicFrontFile ? cnicFrontFile.id : null;
      data.cnicBackFileId = cnicBackFile ? cnicBackFile.id : null;
      if (!data.id) data.id = folder.id;
      return data;
    }));
    results.push(...batchResults);
  }
  return results;
}

async function loadAllFromDrive() {

async function updateEmployeeInDrive(data) {
  await renameFile(data.folderId, folderNameFor(data));
  if (data.profileFileId) await updateFileContent(data.profileFileId, 'application/json', JSON.stringify(profileCopyOf(data)), true);
  else data.profileFileId = await createFileWithContent('profile.json', 'application/json', data.folderId, JSON.stringify(profileCopyOf(data)), true);

  if (data._pictureChanged && data.picture) {
    if (data.pictureFileId) await updateFileContent(data.pictureFileId, 'image/jpeg', data.picture, false);
    else data.pictureFileId = await createFileWithContent('picture.jpg', 'image/jpeg', data.folderId, data.picture, false);
  }
  if (data._cnicFrontChanged && data.cnicFront) {
    if (data.cnicFrontFileId) await updateFileContent(data.cnicFrontFileId, 'image/jpeg', data.cnicFront, false);
    else data.cnicFrontFileId = await createFileWithContent('cnic_front.jpg', 'image/jpeg', data.folderId, data.cnicFront, false);
  }
  if (data._cnicBackChanged && data.cnicBack) {
    if (data.cnicBackFileId) await updateFileContent(data.cnicBackFileId, 'image/jpeg', data.cnicBack, false);
    else data.cnicBackFileId = await createFileWithContent('cnic_back.jpg', 'image/jpeg', data.folderId, data.cnicBack, false);
  }
  delete data._pictureChanged;

  delete data._cnicBackChanged;
}

function compressImage(file, maxW, quality) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * (maxW / w)); w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function wireFormInteractions(store) {
  function formatCNIC(raw) {
    const digits = raw.replace(/\D/g, '').slice(0, 13);
    if (digits.length > 12) return digits.slice(0, 5) + '-' + digits.slice(5, 12) + '-' + digits.slice(12);
    if (digits.length > 5) return digits.slice(0, 5) + '-' + digits.slice(5);
    return digits;
  }

  const cnicInput = document.getElementById('f-cnic');
  if (cnicInput) {
    cnicInput.setAttribute('inputmode', 'numeric');
    cnicInput.addEventListener('input', () => {
      const pos = cnicInput.selectionStart === cnicInput.value.length;
      cnicInput.value = formatCNIC(cnicInput.value);
      if (pos) cnicInput.setSelectionRange(cnicInput.value.length, cnicInput.value.length);
    });
  }

  ['f-dob', 'f-joiningDate'].forEach(id => {
    const el = document.getElementById(id);
    if (el) {
      el.addEventListener('click', () => {
        if (typeof el.showPicker === 'function') {
          try { el.showPicker(); } catch(e) {}
        }
      });
    }
  });

  document.getElementById('f-qualification').addEventListener('change', e => {
    document.getElementById('qual-detail-wrap').classList.toggle('hidden', e.target.value !== 'Graduation Continue');
  });

  document.querySelectorAll('input[name="f-relStatus"]').forEach(r => r.addEventListener('change', () => {
    document.getElementById('children-wrap').classList.toggle('hidden', document.querySelector('input[name="f-relStatus"]:checked')?.value !== 'Married');
  }));

  document.querySelectorAll('input[name="f-prevExp"]').forEach(r => r.addEventListener('change', () => {
    document.getElementById('prevexp-detail-wrap').classList.toggle('hidden', document.querySelector('input[name="f-prevExp"]:checked')?.value !== 'Yes');
  }));

  function wireUpload(boxId, inputId, previewId, storeKey, changedFlag, maxW, quality) {
    document.getElementById(boxId).onclick = () => document.getElementById(inputId).click();
    document.getElementById(inputId).addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;
      try {
        const dataUrl = await compressImage(file, maxW, quality);
        store[storeKey] = dataUrl;
        store[changedFlag] = true;
        const prev = document.getElementById(previewId);
        prev.src = dataUrl;
        prev.classList.remove('hidden');
      } catch(err) {
        toast('Image processing error.', true);
      }
    });
  }

  wireUpload('pic-box', 'f-picture', 'pic-preview', 'picture', '_pictureChanged', 500, 0.7);
  wireUpload('cnicf-box', 'f-cnicFront', 'cnicf-preview', 'cnicFront', '_cnicFrontChanged', 700, 0.6);
  wireUpload('cnicb-box', 'f-cnicBack', 'cnicb-preview', 'cnicBack', '_cnicBackChanged', 700, 0.6);
}

function validateForm(data) {
  const missing = [];
  if (!data.position) missing.push('Position');
  if (!data.fullName) missing.push('Full Name');
  if (!data.dob) missing.push('Date of Birth');
  if (!data.cnic) missing.push('CNIC');
  if (!data.joiningDate) missing.push('Joining Date');
  if (!data.permanentAddress) missing.push('Permanent Address');
  if (!data.temporaryAddress) missing.push('Temporary Address');
  if (!data.mobileNumber) missing.push('Mobile Number');
  if (!data.homeNumber) missing.push('Home Number (Emergency Contact)');
  if (!data.qualification) missing.push('Qualification');
  if (data.qualification === 'Graduation Continue' && !data.qualificationDetail) missing.push('Qualification Detail');
  if (!data.previousExperience) missing.push('Previous Experience (Yes/No)');
  if (data.previousExperience === 'Yes') {
    if (!data.prevExpDetail) missing.push('Experience Detail');
    if (!data.prevSalary) missing.push('Previous Salary');
    if (!data.prevReason) missing.push('Reason for Leaving');
  }
  if (!data.picture) missing.push('Picture');
  if (!data.cnicFront) missing.push('CNIC Front');
  if (!data.cnicBack) missing.push('CNIC Back');
  return missing;
}

function wireLazyThumbs() {
  const imgs = document.querySelectorAll('img.lazy-thumb[data-file-id]');
  if (!imgs.length) return;
  const load = async img => {
    if (img.dataset.loaded === '1') return;
    img.dataset.loaded = '1';
    try { img.src = await getFileDataUrl(img.dataset.fileId); } catch(e) { img.replaceWith(Object.assign(document.createElement('div'), { className:'file-thumb placeholder', textContent:'📷' })); }
  };
  if (!('IntersectionObserver' in window)) { imgs.forEach(load); return; }
  const observer = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) { load(entry.target); observer.unobserve(entry.target); } }), { rootMargin:'200px' });
  imgs.forEach(img => observer.observe(img));
}

function filterList(list, query) {
  if (!query) return list;
  const q = query.toLowerCase();
  return list.filter(e => (e.fullName || '').toLowerCase().includes(q) || (e.cnic || '').toLowerCase().includes(q));
}

  document.getElementById('logout-btn').onclick = logoutFlow;
  document.getElementById('back-dash').onclick = () => { view = 'dashboard'; render(); };
  const searchInput = document.getElementById('search-current');
  searchInput.addEventListener('input', e => {
    searchQueryCurrent = e.target.value;
    document.getElementById('grid-wrap').innerHTML = fileGridHTML(filterList(currentEmployees, searchQueryCurrent), 'active');
    wireFileCardClicks('current');
  });
  wireFileCardClicks('current');
}

function renderResignedList() {
  const filtered = filterList(resignedEmployees, searchQueryResigned);
  app.innerHTML = topbarHTML() + `
  <div id="main-wrap">
    <div class="section-title"><span class="back-link" id="back-dash">&larr; Dashboard</span></div>
    <h2 class="glow" style="margin:10px 0 4px;">Resigned / Retired Archives (${resignedEmployees.length})</h2>
    <div class="search-bar"><input id="search-resigned" placeholder="Search by name or CNIC..." value="${esc(searchQueryResigned)}"></div>
    <div id="grid-wrap">${fileGridHTML(filtered, 'gone')}</div>
  </div>`;
  document.getElementById('logout-btn').onclick = logoutFlow;

  const searchInput = document.getElementById('search-resigned');

    searchQueryResigned = e.target.value;

function wireFileCardClicks(source) {
  document.querySelectorAll('.file-card').forEach(card => {
    card.onclick = () => openDetail(card.getAttribute('data-id'), source);
  });
  wireLazyThumbs();
}

function pfield(label, value) {
  if (value === undefined || value === null || String(value).trim() === '') return '';
  return `<div class="prow"><div class="plabel">${esc(label)}</div><div class="pvalue">${esc(value)}</div></div>`;
}

function buildPrintableHTML(emp) {
  let rows = '';
  rows += pfield('Position', emp.position);
  rows += pfield('Salary', emp.salary);
  rows += pfield('Full Name', emp.fullName);
  rows += pfield('Father Name', emp.fatherName);
  rows += pfield('Date of Birth', emp.dob);
  rows += pfield('CNIC', emp.cnic);
  rows += pfield('Gender', emp.gender);
  rows += pfield('Joining Date', emp.joiningDate);
  rows += pfield('Marital Status', emp.relationshipStatus);
  if (emp.relationshipStatus === 'Married') rows += pfield('Number of Children', emp.childrenCount);
  rows += pfield('Permanent Address', emp.permanentAddress);
  rows += pfield('Temporary Address', emp.temporaryAddress);
  rows += pfield('Mobile Number', emp.mobileNumber);
  rows += pfield('Emergency Contact', emp.homeNumber);
  rows += pfield('Email', emp.email);
  rows += pfield('Qualification', emp.qualification);
  if (emp.qualification === 'Graduation Continue') rows += pfield('Qualification Detail', emp.qualificationDetail);
  rows += pfield('Previous Experience', emp.previousExperience);
  if (emp.previousExperience === 'Yes') {
    rows += pfield('Experience Detail', emp.prevExpDetail);
    rows += pfield('Previous Salary', emp.prevSalary);
    rows += pfield('Reason for Leaving', emp.prevReason);
  }
  if (emp.status === 'resigned') {
    rows += pfield('Exit Type', emp.exitType);
    rows += pfield('Exit Date', emp.exitDate);
    rows += pfield('Exit Note', emp.exitNote);
  }
  return `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${esc(emp.fullName || 'Employee')} - Record</title>
  <style>
    body{ font-family: Arial, sans-serif; color:#111; padding:24px; }
    .phead{ display:flex; justify-content:space-between; align-items:flex-end; border-bottom:3px solid #1c8a52; padding-bottom:14px; margin-bottom:20px; }
    .phead h1{ font-size:20px; margin:0; }
    .ptop{ display:flex; gap:20px; margin-bottom:20px; align-items:center; }
    .ptop img.photo{ width:110px; height:110px; object-fit:cover; border:1px solid #ccc; border-radius:4px; }
    .pname{ font-size:18px; font-weight:bold; }
    .pposition{ font-size:13px; color:#555; }
    .pgrid{ display:grid; grid-template-columns:1fr 1fr; gap:0 24px; font-size:12.5px; }
    .prow{ padding:6px 0; border-bottom:1px solid #eee; break-inside:avoid; }
    .plabel{ font-size:9.5px; text-transform:uppercase; letter-spacing:0.5px; color:#777; }
    .pvalue{ margin-top:2px; }
    .pdocs{ display:flex; gap:14px; margin-top:22px; }
    .pdocs img{ width:150px; height:100px; object-fit:cover; border:1px solid #ccc; border-radius:4px; }
    .pdocs .dlbl{ font-size:10px; color:#666; text-align:center; margin-top:4px; }
    .pfooter{ margin-top:26px; font-size:10px; color:#888; border-top:1px solid #ddd; padding-top:10px; }
    @media print{ body{ padding:8mm; } }
  </style></head>
  <body>
    <div class="phead"><div><h1>OPTP Sch III</h1><div style="font-size:11px;color:#555;">Employee Record File</div></div></div>
    <div class="ptop">
      ${emp.picture ? `<img class="photo" src="${emp.picture}">` : ''}
      <div><div class="pname">${esc(emp.fullName || '')}</div><div class="pposition">${esc(emp.position || '')}</div></div>
    </div>
    <div class="pgrid">${rows}</div>
    <div class="pdocs">
      ${emp.cnicFront ? `<div><img src="${emp.cnicFront}"><div class="dlbl">CNIC Front</div></div>` : ''}
      ${emp.cnicBack ? `<div><img src="${emp.cnicBack}"><div class="dlbl">CNIC Back</div></div>` : ''}
    </div>
    <div class="pfooter">Confidential Employee Record &bull; OPTP System</div>
  </body></html>`;
}

function openPrintableRecord(emp) {
  const html = buildPrintableHTML(emp);
  const w = window.open('', '_blank', 'width=900,height=1000');
  if (!w) { toast('Popup blocked by browser.', true); return; }
  w.document.open(); w.document.write(html); w.document.close();
  const triggerPrint = () => { try { w.focus(); w.print(); } catch(e) {} };
  w.onload = triggerPrint; setTimeout(triggerPrint, 500);
}

async function downloadEmployeePDF(emp) {
  try {
    if (!window.html2canvas || !window.jspdf) { toast('PDF engine is still loading. Try again.', true); return; }
    await loadEmployeeAssets(emp, true);
    const holder = document.createElement('div');
    holder.style.cssText = 'position:fixed;left:-100000px;top:0;width:794px;background:#fff;z-index:-1;';
    const printable = buildPrintableHTML(emp);
    const styleMatch = printable.match(/<style>([\s\S]*?)<\/style>/i);
    const bodyMatch = printable.match(/<body>([\s\S]*?)<\/body>/i);
    const style = styleMatch ? `<style>${styleMatch[1]}</style>` : '';
    const body = bodyMatch ? bodyMatch[1] : printable;
    holder.innerHTML = style + `<div class="pdf-page-content">${body}</div>`;
    document.body.appendChild(holder);
    const canvas = await html2canvas(holder, {scale:2, useCORS:true, backgroundColor:'#fff', logging:false});
    holder.remove();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF('p','mm','a4');
    const pageW = 210, pageH = 297, margin = 8;
    const imgW = pageW - margin*2;
    const pxPerPage = Math.floor(canvas.width * ((pageH-margin*2) / imgW));
    let y = 0, page = 0;
    while (y < canvas.height) {
      const sliceH = Math.min(pxPerPage, canvas.height-y);
      const slice = document.createElement('canvas'); slice.width = canvas.width; slice.height = sliceH;
      slice.getContext('2d').drawImage(canvas,0,y,canvas.width,sliceH,0,0,canvas.width,sliceH);
      const img = slice.toDataURL('image/jpeg',0.92);
      const imgH = sliceH * imgW / canvas.width;
      if (page > 0) pdf.addPage();
      pdf.addImage(img,'JPEG',margin,margin,imgW,imgH);
      y += sliceH; page++;
    }
    const safeName = (emp.fullName || 'Employee_Record').replace(/[^a-z0-9_-]+/gi,'_');
    pdf.save(`${safeName}_Employee_Record.pdf`);
    toast('PDF downloaded successfully.');
  } catch(e) { console.error(e); toast('PDF generation failed. Use Print as fallback.', true); }
}

function detailRow(k, v) {
  return `<div class="detail-item"><div class="k">${esc(k)}</div><div class="v">${(v === undefined || v === '') ? '—' : esc(v)}</div></div>`;
}

async function openDetail(id, source) {
  const list = source === 'current' ? currentEmployees : resignedEmployees;
  const emp = list.find(e => e.id === id);
  if (!emp) return;
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `<div class="panel modal-box"><span class="modal-close" id="detail-close">&times;</span><div class="eyebrow">${source === 'current' ? 'ACTIVE FILE' : 'ARCHIVED FILE'}</div><h2 class="glow" style="margin:6px 0 4px;">${esc(emp.fullName || '(No name)')}</h2><div class="stat-line">${esc(emp.position || '')}</div><div id="detail-assets" class="doc-thumbs"><div class="empty-note">Loading documents...</div></div><div class="detail-grid" id="detail-fields"></div><div class="modal-actions"><button class="btn cyan" id="print-btn">Print</button><button class="btn cyan" id="pdf-btn">Save PDF</button><button class="btn cyan" id="edit-btn">Edit</button>${source === 'current' ? `<button class="btn amber" id="resign-btn">Mark Resigned</button>` : `<button class="btn amber" id="reactivate-btn">Reactivate</button>`}<button class="btn red" id="delete-btn">Delete</button></div></div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#detail-close').onclick = () => overlay.remove();
  const fields = [['Position',emp.position],['Salary',emp.salary],['Full Name',emp.fullName],['Father Name',emp.fatherName],['DOB',emp.dob],['CNIC',emp.cnic],['Gender',emp.gender],['Joining Date',emp.joiningDate],['Marital Status',emp.relationshipStatus],['Children',emp.childrenCount],['Permanent Address',emp.permanentAddress],['Temporary Address',emp.temporaryAddress],['Mobile Number',emp.mobileNumber],['Emergency Contact',emp.homeNumber],['Email',emp.email],['Qualification',emp.qualification],['Qualification Detail',emp.qualificationDetail],['Previous Experience',emp.previousExperience],['Experience Detail',emp.prevExpDetail],['Previous Salary',emp.prevSalary],['Reason for Leaving',emp.prevReason]];
  if (source === 'resigned') fields.push(['Exit Type',emp.exitType],['Exit Date',emp.exitDate],['Exit Note',emp.exitNote]);
  overlay.querySelector('#detail-fields').innerHTML = fields.map(([k,v]) => detailRow(k,v)).join('');
  try {
    await loadEmployeeAssets(emp, true);
    if (!document.body.contains(overlay)) return;
    overlay.querySelector('#detail-assets').innerHTML = `<div>${emp.picture ? `<img src="${esc(emp.picture)}">` : ''}<div class="lbl">Picture</div></div><div>${emp.cnicFront ? `<img src="${esc(emp.cnicFront)}">` : ''}<div class="lbl">CNIC Front</div></div><div>${emp.cnicBack ? `<img src="${esc(emp.cnicBack)}">` : ''}<div class="lbl">CNIC Back</div></div>`;
  } catch(e) { overlay.querySelector('#detail-assets').innerHTML = `<div class="empty-note">Some documents could not be loaded.</div>`; }
  overlay.querySelector('#print-btn').onclick = () => authorizeAction('Print employee record', () => openPrintableRecord(emp));
  overlay.querySelector('#pdf-btn').onclick = () => authorizeAction('Generate PDF', () => downloadEmployeePDF(emp));
  overlay.querySelector('#edit-btn').onclick = () => authorizeAction('Edit employee record', async () => { overlay.remove(); await openEditForm(emp, source); });
  overlay.querySelector('#delete-btn').onclick = () => authorizeAction('Delete employee record', async () => {
    if (!confirm(`Move "${emp.fullName || 'this file'}" to Google Drive Trash?`)) return;
    try { await trashFolder(emp.folderId); const arr = source === 'current' ? currentEmployees : resignedEmployees; const idx = arr.findIndex(e => e.id === id); if (idx > -1) arr.splice(idx,1); overlay.remove(); toast('Moved to Drive Trash.'); render(); } catch(e) { toast('Delete request failed.', true); }
  });
  if (source === 'current') overlay.querySelector('#resign-btn').onclick = () => authorizeAction('Change employee status', () => { overlay.remove(); openResignDialog(emp); });
  else overlay.querySelector('#reactivate-btn').onclick = () => authorizeAction('Reactivate employee', async () => {
    try { await moveFolder(emp.folderId, resignedFolderId, currentFolderId); const idx = resignedEmployees.findIndex(e => e.id === id); if (idx > -1) { const [moved] = resignedEmployees.splice(idx,1); moved.status='current'; delete moved.exitType; delete moved.exitDate; delete moved.exitNote; await updateFileContent(moved.profileFileId,'application/json',JSON.stringify(profileCopyOf(moved)),true); currentEmployees.push(moved); } overlay.remove(); toast('Employee reactivated.'); view='current'; render(); } catch(e) { toast('Reactivation failed.', true); }
  });
}

function openResignDialog(emp) {
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="panel pw-modal-box" style="max-width:420px;text-align:left;">
      <div class="eyebrow">STATUS CHANGE</div>
      <h3 style="margin:8px 0 16px;">${esc(emp.fullName)}</h3>
      <div class="field"><label>Status Type</label>
        <div class="radio-group">
          <label class="radio-opt"><input type="radio" name="exit-type" value="Resigned" checked> Resigned</label>
          <label class="radio-opt"><input type="radio" name="exit-type" value="Retired"> Retired</label>
        </div>
      </div>
      <div class="field"><label>Exit Date</label><input type="date" id="exit-date"></div>
      <div class="field"><label>Remarks</label><textarea id="exit-note" rows="2"></textarea></div>
      <div style="display:flex;gap:10px;justify-content:flex-end;">
        <button class="btn cyan" id="exit-cancel">Cancel</button>
        <button class="btn amber" id="exit-confirm">Confirm</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  overlay.querySelector('#exit-cancel').onclick = () => overlay.remove();
  const exitDateEl = overlay.querySelector('#exit-date');
  exitDateEl.addEventListener('click', () => {
    if (typeof exitDateEl.showPicker === 'function') {
      try { exitDateEl.showPicker(); } catch(e) {}
    }
  });
  overlay.querySelector('#exit-confirm').onclick = async () => {
    const type = overlay.querySelector('input[name="exit-type"]:checked').value;
    const date = overlay.querySelector('#exit-date').value.trim();
    const note = overlay.querySelector('#exit-note').value.trim();
    const btn = overlay.querySelector('#exit-confirm');
    btn.disabled = true;
    btn.textContent = 'Updating...';
    try {
      await moveFolder(emp.folderId, currentFolderId, resignedFolderId);
      const idx = currentEmployees.findIndex(e => e.id === emp.id);
      if (idx > -1) {
        const [moved] = currentEmployees.splice(idx, 1);
        moved.status = 'resigned';
        moved.exitType = type;
        moved.exitDate = date;
        moved.exitNote = note;
        await updateFileContent(moved.profileFileId, 'application/json', JSON.stringify(profileCopyOf(moved)), true);
        resignedEmployees.push(moved);
      }
      overlay.remove();
      toast('Status updated.');
      view = 'resigned';
      render();
    } catch(e) {
      toast('Status update failed.', true);
      btn.disabled = false;
      btn.textContent = 'Confirm';
    }
  };
}

async function openEditForm(emp, source) {
  try { await loadEmployeeAssets(emp, true); } catch(e) {}
  const store = Object.assign({}, emp);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="panel modal-box">
      <span class="modal-close" id="edit-close">&times;</span>
      <div class="eyebrow">EDIT RECORD</div>
      <h2 class="glow" style="margin:6px 0 16px;">${esc(emp.fullName || '(No name)')}</h2>
      ${formFieldsHTML(emp)}
      <div class="form-actions">
        <button class="btn" id="save-edit-btn">Save Changes</button>
        <button class="btn cyan" id="cancel-edit-btn">Cancel</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  wireFormInteractions(store);
  overlay.querySelector('#edit-close').onclick = () => overlay.remove();
  overlay.querySelector('#cancel-edit-btn').onclick = () => overlay.remove();
  overlay.querySelector('#save-edit-btn').onclick = async () => {
    const data = collectFormData(store);
    const missing = validateForm(data);
    if (missing.length) {
      toast('Required: ' + missing.join(', '), true);
      return;
    }
    data.id = emp.id;
    data.status = emp.status;
    data.folderId = emp.folderId;
    data.profileFileId = emp.profileFileId;
    data.pictureFileId = emp.pictureFileId;
    data.cnicFrontFileId = emp.cnicFrontFileId;
    data.cnicBackFileId = emp.cnicBackFileId;
    if (source === 'resigned') {
      data.exitType = emp.exitType;
      data.exitDate = emp.exitDate;
      data.exitNote = emp.exitNote;
    }
    const btn = overlay.querySelector('#save-edit-btn');
    btn.disabled = true;
    btn.textContent = 'Saving Changes...';
    try {
      await updateEmployeeInDrive(data);
      const arr = source === 'current' ? currentEmployees : resignedEmployees;
      const idx = arr.findIndex(e => e.id === emp.id);
      if (idx > -1) arr[idx] = data;
      overlay.remove();
      toast('Changes saved to Drive.');
      render();
    } catch(e) {
      toast('Failed to update file.', true);
      btn.disabled = false;
      btn.textContent = 'Save Changes';
    }
  };
}

window.addEventListener('error', (event) => {
  console.error('Unhandled application error:', event.error || event.message);
});

window.addEventListener('unhandledrejection', (event) => {
  console.error('Unhandled promise rejection:', event.reason);
});

function render(loadingMsg) {
  if (view === 'login') renderLogin();
  else if (view === 'loading') renderLoading(loadingMsg);
  else if (view === 'dashboard') renderDashboard();
  else if (view === 'new') renderNewEmployee();
  else if (view === 'current') renderCurrentList();
  else if (view === 'resigned') renderResignedList();
}
render();
</script>
</body>
